<!doctype html>
<!--
  The image of a shared link, in every format in `images` of src/lib/seo/site.ts. `pnpm og`
  renders it with a Chromium browser (scripts/og.ts) after `pnpm dev` or `pnpm build` has
  downloaded the fonts. To look at one format while changing it, open this file in a browser
  with `?format=landscape` or `?format=square`.

  Previews get cropped: a messenger's thumbnail is the square in the middle, X cuts to 2:1. So
  the landscape image keeps everything that matters in its middle 630 pixels, and whatever sits
  beside that column sits beside it entirely. Type is large, because a preview is shown at a
  third of this size.

  The flower is drawn from the same numbers as src/components/brand/Bloom.tsx, the sky from
  the glyphs in src/components/brand/Sprinkles.tsx.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Petal — put your chat on screen</title>
        <style>
            @font-face {
                font-family: "Clash Display";
                src: url("../public/fonts/fontshare/clash-display-600.woff2") format("woff2");
                font-weight: 600;
            }
            @font-face {
                font-family: "Clash Display";
                src: url("../public/fonts/fontshare/clash-display-400.woff2") format("woff2");
                font-weight: 400;
            }
            @font-face {
                font-family: "JetBrains Mono";
                src: url("../public/fonts/jetbrains-mono/jetbrains-mono-latin-wght-normal.woff2")
                    format("woff2");
                font-weight: 100 800;
            }
            :root {
                --bloom: #ff2e52;
                --ink: #1a1216;
                --ink-60: rgb(26 18 22 / 0.6);
                /* Landscape, 1200 × 630. */
                --width: 1200px;
                --height: 630px;
                --flower: 172px;
                --name: 36px;
                --statement: 82px;
                --line: 24px;
                --margin: 21px;
                --edge: 46px;
                --gap: 14px;
            }
            :root[data-format="square"] {
                --width: 1200px;
                --height: 1200px;
                --flower: 400px;
                --name: 58px;
                --statement: 132px;
                --line: 32px;
                --margin: 26px;
                --edge: 76px;
                --gap: 30px;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            body {
                position: relative;
                width: var(--width);
                height: var(--height);
                overflow: hidden;
                background: #fff;
                color: var(--ink);
                font-family: "Clash Display", sans-serif;
                font-weight: 600;
                letter-spacing: -0.02em;
            }
            .seed {
                color: var(--bloom);
            }
            main {
                position: absolute;
                inset: 0 0 calc(var(--edge) + var(--margin));
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            #bloom {
                width: var(--flower);
                height: var(--flower);
                overflow: visible;
            }
            .name {
                margin-top: var(--gap);
                font-size: var(--name);
                line-height: 1;
            }
            h1 {
                margin-top: calc(var(--gap) * 0.9);
                font-size: var(--statement);
                font-weight: 600;
                line-height: 0.98;
            }
            .line,
            footer {
                font-family: "JetBrains Mono", monospace;
                font-weight: 500;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            .line {
                margin-top: calc(var(--gap) * 1.5);
                font-size: var(--line);
                line-height: 1.5;
            }
            .line span {
                color: var(--ink-60);
            }
            footer {
                position: absolute;
                right: var(--edge);
                bottom: var(--edge);
                left: var(--edge);
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: baseline;
                color: var(--ink-60);
                font-size: var(--margin);
                line-height: 1;
            }
            .studio {
                grid-column: 3;
                justify-self: end;
                color: var(--ink);
                font-family: "Clash Display", sans-serif;
                font-size: calc(var(--margin) * 1.2);
                font-weight: 600;
                letter-spacing: -0.02em;
                text-transform: none;
            }
            .studio span:first-child {
                color: var(--ink-60);
                font-weight: 400;
            }
            .address {
                grid-column: 2;
            }
            /* Nothing crops a square, so the address can sit in the corner. */
            [data-format="square"] .address {
                grid-column: 1;
                grid-row: 1;
            }
            .sprinkle {
                position: absolute;
                overflow: visible;
            }
        </style>
    </head>
    <body>
        <main>
            <svg id="bloom" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
            <p class="name">Petal<span class="seed">.</span></p>
            <h1>Put your <span class="seed">chat</span><br />on screen.</h1>
            <p class="line">Free Twitch chat overlay for OBS<br /><span>7TV · BTTV · FFZ emotes · no login</span></p>
        </main>
        <footer>
            <p class="address">petal.shiftbloom.studio</p>
            <p class="studio">shiftbloom <span>studio</span><span class="seed">.</span></p>
        </footer>

        <script>
            const format = new URLSearchParams(location.search).get("format") ?? "landscape";
            document.documentElement.dataset.format = format;

            // Brand Book v2.0 §04: four petal rings and a seed.
            const rings = [
                { tip: 100, petals: 10, width: 32, length: 90, from: "#D8163F", to: "#FF2E52", offset: 0 },
                { tip: 74, petals: 10, width: 25.16, length: 66.6, from: "#FF2E52", to: "#FF7E9E", offset: 18 },
                { tip: 50, petals: 8, width: 19, length: 45, from: "#FF7E9E", to: "#FFC2D3", offset: 40.5 },
                { tip: 27, petals: 6, width: 12.96, length: 24.3, from: "#FFB4CA", to: "#FFDCE7", offset: 70.5 },
            ];
            const petals = rings
                .map(({ tip, petals, width: w, length: l, from, to, offset }, ring) => {
                    const c = Math.round(55 * l) / 100;
                    const petal = `M 0,0 C ${w},0 ${w},${-c} 0,${-l} C ${-w},${-c} ${-w},0 0,0 Z`;
                    const paths = Array.from({ length: petals }, (_, i) => {
                        const angle = offset + (360 / petals) * i;
                        return `<path d="${petal}" transform="rotate(${angle}) translate(0 ${l - tip})"/>`;
                    });
                    return `<defs><linearGradient id="ring-${ring}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${-l}"><stop offset="0" stop-color="${from}"/><stop offset="1" stop-color="${to}"/></linearGradient></defs><g fill="url(#ring-${ring})">${paths.join("")}</g>`;
                })
                .join("");
            document.getElementById("bloom").innerHTML = `${petals}<circle r="7" fill="#FF2E52"/>`;

            // The sky (§07): sparks, crosses and dots, red or ink, in the margins only.
            const glyphs = {
                spark: `<path d="M0-10C.6-2 2-.6 10 0 2 .6.6 2 0 10-.6 2-2 .6-10 0-2-.6-.6-2 0-10Z"/>`,
                cross: `<path d="M-3.4-10h6.8v6.6H10v6.8H3.4V10h-6.8V3.4H-10v-6.8h6.6Z"/>`,
                dot: `<circle r="10"/>`,
            };
            const sky = {
                landscape: [
                    ["spark", "#ff2e52", 24, "top: 84px; left: 150px"],
                    ["dot", "#ff2e52", 9, "top: 292px; left: 86px"],
                    ["cross", "#1a1216", 14, "top: 430px; left: 170px"],
                    ["cross", "#1a1216", 14, "top: 96px; right: 190px"],
                    ["dot", "#1a1216", 8, "top: 262px; right: 92px"],
                    ["spark", "#ff2e52", 18, "top: 420px; right: 150px"],
                ],
                square: [
                    ["spark", "#ff2e52", 24, "top: 130px; left: 150px"],
                    ["dot", "#ff2e52", 10, "top: 420px; left: 96px"],
                    ["cross", "#1a1216", 16, "top: 560px; left: 170px"],
                    ["cross", "#1a1216", 16, "top: 150px; right: 170px"],
                    ["dot", "#1a1216", 10, "top: 440px; right: 110px"],
                    ["spark", "#ff2e52", 20, "top: 570px; right: 190px"],
                ],
            };
            for (const [glyph, color, size, at] of sky[format] ?? sky.landscape) {
                document.body.insertAdjacentHTML(
                    "beforeend",
                    `<svg class="sprinkle" aria-hidden="true" style="${at}" width="${size}" height="${size}" viewBox="-10 -10 20 20" fill="${color}">${glyphs[glyph]}</svg>`,
                );
            }
        </script>
    </body>
</html>
